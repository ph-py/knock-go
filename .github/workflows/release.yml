name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run automated tests
        run: go test -v ./...

      - name: Build matrix and create archives
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          targets=(
            "windows amd64 .exe zip"
            "windows arm64 .exe zip"
            "linux amd64 '' tar"
            "linux arm64 '' tar"
            "darwin amd64 '' tar"
            "darwin arm64 '' tar"
          )

          for target in "${targets[@]}"; do
            read -r os arch ext format <<< "$target"
            output_name="knock"
            if [ -n "$ext" ]; then
              output_name="knock${ext}"
            fi

            echo "Compiling for ${os}/${arch}..."
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${TAG_NAME}" -o "dist/${output_name}" ./cmd/knock

            pkg_name="knock-${TAG_NAME}-${os}-${arch}"
            mkdir -p "dist/${pkg_name}"
            cp "dist/${output_name}" "dist/${pkg_name}/"
            cp README.md "dist/${pkg_name}/"
            cp COPYING "dist/${pkg_name}/"

            if [ "$format" = "zip" ]; then
              (cd dist && zip -r "${pkg_name}.zip" "${pkg_name}")
            else
              tar -czf "dist/${pkg_name}.tar.gz" -C dist "${pkg_name}"
            fi

            rm -rf "dist/${pkg_name}"
            rm "dist/${output_name}"
          done

          cd dist
          sha256sum * > checksums.txt
          echo "=== CHECKSUMS ==="
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
